<!DOCTYPE html>

<html>

<head>
    <title>AI Generated Quiz</title>

```
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

<div class="container">

```
<h1>🧠 AI Generated Quiz</h1>
<div id="timer"
     style="
        text-align:center;
        font-size:20px;
        font-weight:bold;
        margin:15px;
     ">
    ⏱️ Time Remaining: 10:00
</div>

<p style="text-align:center;">
    Select the correct answer for each question.
</p>

<div id="progressText" style="text-align:center; font-weight:bold;">
    Question 1 of {{ questions|length }}
</div>

<div style="margin:20px 0;">
    <div style="
        width:100%;
        height:10px;
        background:#ddd;
        border-radius:10px;
    ">
        <div id="progressBar" style="
            width:0%;
            height:10px;
            background:#4CAF50;
            border-radius:10px;
        "></div>
    </div>
</div>

<form method="POST" action="/submit_quiz" id="quizForm">

    {% for question in questions %}

    <div class="question"
         id="question{{ loop.index }}"
         style="display:none;">

        <h3>
            {{ loop.index }}. {{ question.question }}
        </h3>

        <label class="option">
            <input type="radio"
                   name="q{{ loop.index }}"
                   value="A"
                   {% if loop.index == 1 %}required{% endif %}>
            A) {{ question.options.A }}
        </label>

        <label class="option">
            <input type="radio"
                   name="q{{ loop.index }}"
                   value="B">
            B) {{ question.options.B }}
        </label>

        <label class="option">
            <input type="radio"
                   name="q{{ loop.index }}"
                   value="C">
            C) {{ question.options.C }}
        </label>

        <label class="option">
            <input type="radio"
                   name="q{{ loop.index }}"
                   value="D">
            D) {{ question.options.D }}
        </label>

    </div>

    {% endfor %}

    <div style="text-align:center; margin-top:25px;">

        <button type="button"
                id="previousButton"
                onclick="previousQuestion()"
                style="display:none;">
            Previous
        </button>

        <button type="button"
                id="nextButton"
                onclick="nextQuestion()">
            Next
        </button>

        <button type="submit"
                id="submitButton"
                style="display:none;">
            Submit Quiz
        </button>

    </div>

</form>
```

</div>

<script>

let currentQuestion = 1;

const totalQuestions = {{ questions|length }};

function showQuestion(number) {

    for (let i = 1; i <= totalQuestions; i++) {

        document.getElementById("question" + i).style.display = "none";

    }

    document.getElementById("question" + number).style.display = "block";

    document.getElementById("progressText").innerText =
        "Question " + number + " of " + totalQuestions;

    let progress =
        (number / totalQuestions) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";

    if (number === 1) {

        document.getElementById("previousButton").style.display = "none";

    } else {

        document.getElementById("previousButton").style.display = "inline-block";

    }

    if (number === totalQuestions) {

        document.getElementById("nextButton").style.display = "none";

        document.getElementById("submitButton").style.display = "inline-block";

    } else {

        document.getElementById("nextButton").style.display = "inline-block";

        document.getElementById("submitButton").style.display = "none";

    }
}

function nextQuestion() {

    let current = document.querySelector(
        'input[name="q' + currentQuestion + '"]:checked'
    );

    if (!current) {

        alert("Please select an answer before continuing.");

        return;
    }

    currentQuestion++;

    showQuestion(currentQuestion);
}

function previousQuestion() {

    if (currentQuestion > 1) {

        currentQuestion--;

        showQuestion(currentQuestion);
    }
}

showQuestion(1);
let timeLeft = 10 * 60;

const timer = setInterval(function () {

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    seconds = seconds < 10 ? "0" + seconds : seconds;

    document.getElementById("timer").innerText =
        "⏱️ Time Remaining: " + minutes + ":" + seconds;

    if (timeLeft <= 0) {

        clearInterval(timer);

        alert("⏰ Time is up! Your quiz will be submitted.");

        document.getElementById("quizForm").submit();
    }

    timeLeft--;

}, 1000);
</script>

</body>

</html>
