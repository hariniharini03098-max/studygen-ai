<!DOCTYPE html>
<html>
<head>
    <title>AI Notes and Quiz Generator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Notes and Quiz Generator</h1>

        <p style="text-align:center;">
            Upload your study material and let AI generate
            concise notes and an interactive quiz.
        </p>

        <div class="upload-box">

            <form action="/upload" method="POST" enctype="multipart/form-data">

                <h2>Upload Study Material</h2>

                <input
                    type="file"
                    name="pdf_file"
                    accept=".pdf,.docx,.txt,.pptx,.jpg,.jpeg,.png"
                    required
                >

                <br><br>

                <h3>Select Quiz Difficulty</h3>

                <label>
                    <input type="radio" name="difficulty" value="Easy" required>
                    Easy
                </label>

                <label>
                    <input type="radio" name="difficulty" value="Medium">
                    Medium
                </label>

                <label>
                    <input type="radio" name="difficulty" value="Hard">
                    Hard
                </label>

                <h3>Select Number of Questions</h3>

                <select name="question_count" required>
                    <option value="5">5 Questions</option>
                    <option value="10">10 Questions</option>
                    <option value="15">15 Questions</option>
                </select>

                <br><br>

                <button type="submit">
                    Generate Notes & Quiz
                </button>

            </form>

        </div>

    </div>

</body>
</html>
